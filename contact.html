
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact MUSE | Fashion & Lifestyle</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <nav class="navbar md:navbar-expand bg-1">
      <div class="container">
        <a class="navbar-brand" href="index.html">MUSE</a>

        <button class="btn-icon navbar-toggler" type="button"
          data-bs-toggle="drawer"
          data-bs-target="#siteMenu"
          aria-controls="siteMenu"
          aria-expanded="false"
          aria-label="Open menu">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>

        <dialog class="drawer drawer-end" id="siteMenu"
          aria-labelledby="siteMenuLabel">

          <div class="drawer-header">
            <h2 class="drawer-title h5" id="siteMenuLabel">MUSE Menu</h2>
            <button class="btn-close" type="button"
              data-bs-dismiss="drawer" aria-label="Close menu"></button>
          </div>

          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="index.html#explore">Explore</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page"
                  href="contact.html">Contact</a>
              </li>
            </ul>
          </div>

        </dialog>
      </div>
    </nav>
  </header>

  <!-- CONTACT PAGE -->
  <main class="container py-5">

    <h1>Contact MUSE</h1>
    <p class="lead">
      Have a question, suggestion, or collaboration idea?
      We'd love to hear from you.
    </p>

    <form action="#" method="get">

      <div class="row g-4">

        <!-- FIRST NAME -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="firstName">First Name</label>
            <input class="form-control" type="text"
              id="firstName" name="firstName" required>
          </div>
        </div>

        <!-- LAST NAME -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="lastName">Last Name</label>
            <input class="form-control" type="text"
              id="lastName" name="lastName" required>
          </div>
        </div>

        <!-- EMAIL -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="email">Email Address</label>
            <input class="form-control" type="email"
              id="email" name="email"
              placeholder="you@example.com" required>
          </div>
        </div>

        <!-- TOPIC -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="topic">Inquiry Type</label>
            <select class="form-control" id="topic" name="topic" required>
              <option value="">Choose a topic</option>
              <option value="fashion">Fashion</option>
              <option value="beauty">Beauty</option>
              <option value="collaboration">Collaboration</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <!-- MESSAGE -->
        <div class="col-12">
          <div class="form-field">
            <label for="message">Your Message</label>
            <textarea class="form-control" id="message"
              name="message" rows="5" required></textarea>
          </div>
        </div>

        <!-- CONSENT CHECKBOX -->
        <div class="col-12">
          <div class="check">
            <input class="check-input" type="checkbox"
              id="consent" name="consent" required>
            <label class="check-label" for="consent">
              I agree to be contacted about my inquiry.
            </label>
          </div>
        </div>

        <!-- SUBMIT BUTTON -->
        <div class="col-12">
          <button class="btn-solid theme-primary" type="submit">
            Send Message
          </button>
        </div>

      </div>
    </form>

  </main>

  <!-- FOOTER -->
  <footer class="bg-1 py-4 mt-5">
    <div class="container">
      <p>© 2026 MUSE | Fashion, Beauty & Lifestyle</p>
    </div>
  </footer>

  <script type="module" src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
